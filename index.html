<!DOCTYPE html>
<html lang="en">
<head>
  <!-- UTF-8 so Vietnamese/degree symbols render correctly -->
  <meta charset="UTF-8">
  <!-- Makes the page scale properly on phones (farmers use phones) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReRoot – Rotation Planner for Coffee Replanting</title>

  <!-- Chart.js from a CDN so we can draw charts without installing anything -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

  <style>
    /* Base font and max width so the page is readable on desktop */
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #1f2a1f; }
    /* Green heading to match the farming theme */
    h1 { color: #2e6b2e; margin-bottom: 4px; }
    /* Put the inputs and button on one row */
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 16px 0; }
    /* Make inputs and button the same height */
    input, button { padding: 8px 10px; font-size: 15px; }
    button { background: #2e6b2e; color: white; border: none; border-radius: 6px; cursor: pointer; }
    /* Simple bordered table for the monthly numbers */
    table { border-collapse: collapse; width: 100%; margin-top: 16px; font-size: 14px; }
    th, td { border: 1px solid #ccd; padding: 6px; text-align: center; }
    th { background: #eef5ee; }
    /* Status line turns red on errors */
    #status.error { color: #b00020; }
  </style>
</head>
<body>
  <!-- Title + tagline that judges see first -->
  <h1>ReRoot</h1>
  <p>Plan the rotation between pulling out old coffee and replanting — powered by NASA data.</p>

  <!-- Inputs: latitude/longitude pre-filled with our demo farm -->
  <div class="row">
    <label>Latitude<br><input id="lat" type="number" step="0.0001" value="12.5615"></label>
    <label>Longitude<br><input id="lon" type="number" step="0.0001" value="108.2817"></label>
    <button id="loadBtn">Load NASA climate</button>
  </div>

  <!-- Status text tells the user what is happening -->
  <p id="status"></p>

  <!-- Canvas where Chart.js draws the climate chart -->
  <canvas id="climateChart" height="120"></canvas>

  <!-- Table filled in by JavaScript -->
  <table id="climateTable"></table>

  <script>
    // ---------- 1. CONSTANTS ----------

    // NASA POWER monthly endpoint (point data, no API key needed)
    const POWER_URL = "https://power.larc.nasa.gov/api/temporal/monthly/point";
    // The three variables we need: rain, air temperature, root-zone soil wetness
    const PARAMS = ["PRECTOTCORR", "T2M", "GWETROOT"];
    // 10 complete years gives a stable "normal" climate
    const START_YEAR = 2015;
    const END_YEAR = 2024;
    // Month labels for the x-axis and the table
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    // Keep the chart object so we can destroy it before drawing a new one
    let chart = null;

    // ---------- 2. FETCH DATA FROM NASA POWER ----------

    // Builds the URL, calls NASA POWER, and returns the parsed JSON
    async function fetchPower(lat, lon) {
      // URLSearchParams encodes the query string safely
      const query = new URLSearchParams({
        parameters: PARAMS.join(","),
        community: "AG",
        latitude: lat,
        longitude: lon,
        start: START_YEAR,
        end: END_YEAR,
        format: "JSON"
      });
      // fetch() sends the HTTP request; await waits for the answer
      const res = await fetch(`${POWER_URL}?${query}`);
      // A non-200 status means bad input or a server problem, so stop here
      if (!res.ok) throw new Error(`NASA POWER returned HTTP ${res.status}`);
      // Convert the response body from text to a JS object
      return res.json();
    }

    // ---------- 3. TURN 10 YEARS INTO ONE AVERAGE YEAR ----------

    // Input: {"201501": 3.2, "201502": ...}  Output: [12 monthly averages]
    function monthlyAverage(series, fillValue) {
      // One bucket per month to collect values from every year
      const buckets = Array.from({ length: 12 }, () => []);
      // Loop over every "YYYYMM" key NASA sent back
      for (const [key, value] of Object.entries(series)) {
        // The last two characters are the month; parseInt turns "01" into 1
        const month = parseInt(key.slice(4), 10);
        // Month 13 is NASA's annual summary, and fill values mean "no data": skip both
        if (month < 1 || month > 12 || value === fillValue) continue;
        // Store the value in its month bucket (index 0 = January)
        buckets[month - 1].push(value);
      }
      // Average each bucket; null if a month had no valid data
      return buckets.map(b => b.length ? b.reduce((s, v) => s + v, 0) / b.length : null);
    }

    // ---------- 4. DRAW THE CHART ----------

    // rain/temp are 12-number arrays; units come from NASA's own metadata
    function drawChart(rain, temp, rainUnit, tempUnit) {
      // Remove the old chart, otherwise Chart.js stacks them on top of each other
      if (chart) chart.destroy();
      // Bars for rain on the left axis, a line for temperature on the right axis
      chart = new Chart(document.getElementById("climateChart"), {
        data: {
          labels: MONTHS,
          datasets: [
            { type: "bar",  label: `Rain (${rainUnit})`, data: rain, backgroundColor: "#4a90c2", yAxisID: "yRain" },
            { type: "line", label: `Temperature (${tempUnit})`, data: temp, borderColor: "#d0662b", yAxisID: "yTemp" }
          ]
        },
        options: {
          scales: {
            // Left axis for rain
            yRain: { position: "left",  title: { display: true, text: rainUnit } },
            // Right axis for temperature; hide its grid so lines don't clash
            yTemp: { position: "right", title: { display: true, text: tempUnit }, grid: { drawOnChartArea: false } }
          }
        }
      });
    }

    // ---------- 5. FILL THE TABLE ----------

    // Shows the exact numbers so judges can verify the chart
    function drawTable(rain, temp, soil, rainUnit, tempUnit) {
      // Helper: round to 1 decimal, show "–" for missing months
      const fmt = v => (v === null ? "–" : v.toFixed(1));
      // Header row = month names
      let html = `<tr><th></th>${MONTHS.map(m => `<th>${m}</th>`).join("")}</tr>`;
      // One row per variable
      html += `<tr><th>Rain (${rainUnit})</th>${rain.map(v => `<td>${fmt(v)}</td>`).join("")}</tr>`;
      html += `<tr><th>Temp (${tempUnit})</th>${temp.map(v => `<td>${fmt(v)}</td>`).join("")}</tr>`;
      // GWETROOT is 0–1, so multiply by 100 to show it as a percentage
      html += `<tr><th>Root-zone wetness (%)</th>${soil.map(v => `<td>${fmt(v === null ? null : v * 100)}</td>`).join("")}</tr>`;
      // Write the HTML into the table element
      document.getElementById("climateTable").innerHTML = html;
    }

    // ---------- 6. BUTTON: TIE EVERYTHING TOGETHER ----------

    // Runs when the user clicks "Load NASA climate"
    async function onLoadClick() {
      // Grab the status element once so we can update it
      const status = document.getElementById("status");
      // parseFloat converts the input text "12.5615" into the number 12.5615
      const lat = parseFloat(document.getElementById("lat").value);
      const lon = parseFloat(document.getElementById("lon").value);
      // Reject empty or out-of-range coordinates before calling the API
      if (isNaN(lat) || isNaN(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
        status.textContent = "Please enter a valid latitude (−90..90) and longitude (−180..180).";
        status.className = "error";
        return;
      }
      // Tell the user we are working (POWER can take a few seconds)
      status.textContent = "Loading 10 years of NASA POWER data…";
      status.className = "";
      try {
        // Call NASA and wait for the JSON
        const data = await fetchPower(lat, lon);
        // The actual numbers live under properties.parameter
        const p = data.properties.parameter;
        // NASA marks missing values with a fill value (usually -999)
        const fill = data.header?.fill_value ?? -999;
        // Average each variable into one typical year
        const rain = monthlyAverage(p.PRECTOTCORR, fill);
        const temp = monthlyAverage(p.T2M, fill);
        const soil = monthlyAverage(p.GWETROOT, fill);
        // Read units from NASA's metadata instead of guessing them
        const rainUnit = data.parameters?.PRECTOTCORR?.units ?? "mm/day";
        const tempUnit = data.parameters?.T2M?.units ?? "C";
        // Draw the chart and the table
        drawChart(rain, temp, rainUnit, tempUnit);
        drawTable(rain, temp, soil, rainUnit, tempUnit);
        // Done: show which years were averaged (honest about the data)
        status.textContent = `Monthly averages ${START_YEAR}–${END_YEAR}, NASA POWER (AG community).`;
      } catch (err) {
        // Any network/parsing problem ends up here
        status.textContent = `Error: ${err.message}`;
        status.className = "error";
      }
    }

    // Connect the button to the function
    document.getElementById("loadBtn").addEventListener("click", onLoadClick);
    // Load once on page open so the demo is never empty
    onLoadClick();
  </script>
</body>
</html>
